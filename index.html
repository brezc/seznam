<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Přihlášení</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<style>
:root{--bg:#fdf7fb;--card:#fff;--text:#2c2230;--muted:#7b6c80;--line:#ecdde8;--accent:#d9468f;--bad:#c33}
@media (prefers-color-scheme: dark){:root{--bg:#1a1520;--card:#241d2b;--text:#f3eaf4;--muted:#b3a3b8;--line:#3a3043;--accent:#f06aab;--bad:#f77}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:340px}
h1{font-size:18px;margin:0 0 16px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.r{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--muted);font-size:14px}
button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Přihlášení</h1>
  <input id="p" type="password" placeholder="Heslo" aria-label="Heslo" autocomplete="current-password" autofocus required>
  <label class="r"><input id="r" type="checkbox"> Zapamatovat na tomto zařízení</label>
  <button id="b">Pokračovat</button>
  <div id="err" role="alert"></div>
</form>

  // Klíč (ne heslo): v sessionStorage do zavření karty, v localStorage po zaškrtnutí „Zapamatovat“
  const KEY = 'seznam_k_' + (P ? P.s : '');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
  const err = document.getElementById('err');

  async function keyFromPassword(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.s), iterations: P.i }, base, 256);
  }

  async function open(bits) {
    const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
    let plain;
    try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.v) }, key, b64(P.c)); }
    catch (e) { return false; }
    try { sessionStorage.setItem(KEY, toB64(bits)); } catch (e) {}
    const html = new TextDecoder().decode(plain);
    // Dokud se tahle stránka načítá, document.write by obsah jen připsal na konec místo nahrazení
    if (document.readyState !== 'complete') await new Promise(r => addEventListener('load', r, { once: true }));
    document.open(); document.write(html); document.close();
    return true;
  }

  const saved = () => { try { return sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) { return null; } };
  const forget = () => { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} };

  (async () => {
    if (!P || !window.crypto || !crypto.subtle) { err.textContent = 'Stránku nejde otevřít v tomto prohlížeči.'; return; }
    const s = saved();
    if (s) { try { if (await open(b64(s))) return; } catch (e) {} forget(); }
  })();

  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('b');
    btn.disabled = true; err.textContent = '';
    try {
      const bits = await keyFromPassword(document.getElementById('p').value);
      if (document.getElementById('r').checked) { try { localStorage.setItem(KEY, toB64(bits)); } catch (x) {} }
      if (!await open(bits)) { forget(); err.textContent = 'Špatné heslo.'; }
    } catch (x) { err.textContent = 'Něco se pokazilo, zkus to znovu.'; }
    btn.disabled = false;
  });
})();
